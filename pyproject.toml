[project]
name = "aind-motion-energy"
version = "0.1.0"
description = "Motion energy computation from behavior videos for neuroscience pipelines"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Allen Institute for Neural Dynamics", email = "webmaster@alleninstitute.org" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.11"
dependencies = [
    "aind-video-utils>=0.3.1,<1",
    "av>=17.1.0",
    "numpy>=1.26",
    "tqdm>=4.0",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.7",
]

[project.scripts]
aind-motion-energy = "aind_motion_energy.cli:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.7",
    "mkdocs>=1.6",
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    "nbclient>=0.11.0",
    "nbformat>=5.10.4",
    "opencv-python-headless>=4.13.0.92",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "C901", "PLR0915"]
mccabe.max-complexity = 10
pylint.max-statements = 50

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
addopts = "--cov=aind_motion_energy --cov-fail-under=100"

[tool.coverage.report]
fail_under = 100
omit = ["*__init__*"]
