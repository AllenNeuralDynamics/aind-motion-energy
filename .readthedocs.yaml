# Read the Docs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# The project itself still has to be imported once on readthedocs.org by a
# human with an account on that org — this file only describes the build.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"
  commands:
    - pip install uv
    - uv sync --frozen
    - uv run mkdocs build --strict --site-dir "$READTHEDOCS_OUTPUT/html"
