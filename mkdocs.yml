site_name: aind-motion-energy
site_description: Motion energy computation from behavior videos for neuroscience pipelines
site_url: https://aind-motion-energy.readthedocs.io/
repo_url: https://github.com/AllenNeuralDynamics/aind-motion-energy
repo_name: AllenNeuralDynamics/aind-motion-energy
edit_uri: blob/main/docs/
copyright: Copyright &copy; Allen Institute for Neural Dynamics

theme:
  name: material
  features:
    - content.action.edit
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - API reference: reference/
  - Development:
      - Design notes: design-notes.md
      - Optimization backlog: optimization-backlog.md
      - Standards compliance: standards-compliance.md

plugins:
  - search
  - gen-files:
      scripts:
        - scripts/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            docstring_section_style: table
            filters: ["!^_"]
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_root_full_path: false
            show_root_heading: true
            show_signature_annotations: true
            show_source: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

hooks:
  - scripts/mkdocs_hooks.py

watch:
  - src
